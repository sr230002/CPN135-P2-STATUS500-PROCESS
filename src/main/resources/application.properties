spring.application.name=process
server.port=8081
server.servlet.context-path=/process/api/v1

# Base del docente: MariaDB. En local, el contenedor `status500-mariadb` (docker compose).
spring.datasource.url=${APP_DATABASE_URL:jdbc:mariadb://localhost:3307/status500process}
spring.datasource.username=${APP_DATABASE_USERNAME:status500}
spring.datasource.password=${APP_DATABASE_PASSWORD:status500}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

#logging
spring.output.ansi.enabled=always

logging.charset.console=UTF-8
logging.pattern.console=%clr([STATUS500-PROCESS]%d{yyyy-MM-dd HH:mm:ss.SSS}-[%-5level]-[%thread]-[%logger{36}]>>[%msg]%n){fatal=red,error=red,warn=yellow,info=green,debug=cyan,trace=magenta}

logging.level.root=INFO
logging.level.com.ues.cpn135.status500=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot.StartupInfoLogger=INFO
logging.level.org.hibernate.orm.connections.pooling=WARN
logging.level.org.hibernate.orm.core=WARN
logging.level.com.zaxxer.hikari=WARN
